/* Layout: шапка, прокручиваемый экран, плавающая кнопка «Добавить», нижняя панель из 5 разделов, шторка для форм */
:root{
  --bg:#0c0c0e;--glow:#25252b;

  color-scheme:dark;

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}

.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.pad{padding:18px}

.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--fg2)}
.row{display:flex;align-items:center;gap:12px}

.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 0}
.top h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.round{width:38px;height:38px;border-radius:50%;background:var(--card);border:1px solid var(--line);display:grid;place-items:center}
.month{display:flex;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{width:32px;height:32px;border-radius:50%;font-size:19px;color:var(--fg2)}

svg{display:block}
.ic{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;flex:none}

.big{font-size:38px;font-weight:700;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.big small{font-size:24px;color:var(--fg2);font-weight:600;margin-left:3px}
.delta{font-size:13px;font-weight:600;margin-top:6px}
.accs{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.acc{padding:14px;display:flex;flex-direction:column;gap:10px;text-align:left;min-width:0}
.acc b{font-size:19px;font-weight:650;letter-spacing:-.01em;overflow-wrap:anywhere}

.h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0}
.more{font-size:14px;color:var(--blue);font-weight:600}
.legend{display:flex;flex-direction:column;gap:8px;flex:1;min-width:0}

.back{touch-action:none;position:fixed;inset:0;background:rgba(0,0,0,.55);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}

.sheet{overscroll-behavior:contain;-webkit-overflow-scrolling:touch;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--sheet);border-top:1px solid var(--line);border-radius:30px 30px 0 0;
  padding:12px max(18px,env(safe-area-inset-right,0px)) calc(22px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));
  transform:translateY(105%);transition:transform .32s cubic-bezier(.2,.8,.2,1);max-height:92%;overflow:auto}
.sheet.on{transform:none}
#sc{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.grab{width:40px;height:5px;border-radius:9px;background:var(--fg3);margin:0 auto;opacity:.6}
.amount{display:flex;align-items:baseline;justify-content:center;gap:8px}
.amount input{background:none;border:0;color:var(--fg);font:inherit;font-size:50px;font-weight:700;letter-spacing:-.03em;text-align:center;width:100%;min-width:0;outline:none}
.amount input::placeholder{color:var(--fg3)}
.amount em{font-style:normal;font-size:30px;color:var(--fg2);font-weight:600}
.save{background:var(--btn);color:var(--btn-fg);border-radius:18px;padding:16px;font-weight:700;font-size:17px;width:100%}
.save:disabled{opacity:.45}
.ghost{background:var(--input);border-radius:16px;padding:14px;font-weight:600;width:100%}
.dang{color:var(--neg);padding:10px;font-weight:600;width:100%}
.err{color:var(--neg);font-size:14px;text-align:center}
.ok{color:var(--pos);font-size:14px;text-align:center}
.empty{padding:30px 22px;text-align:center;color:var(--fg2)}
.empty b{display:block;color:var(--fg);font-size:18px;margin-bottom:5px}
.sw{display:flex;flex-wrap:wrap;gap:10px}
.sw button{width:34px;height:34px;border-radius:50%;border:3px solid transparent}
.sw button.on{border-color:var(--fg)}
.sub{display:flex;align-items:center;gap:8px;padding:2px 2px 4px}
.sub button.bk{font-size:28px;color:var(--blue);padding:0 10px 4px 0;line-height:1}
.sub h2{margin:0;font-size:24px;letter-spacing:-.02em}
.tg{width:50px;height:30px;border-radius:99px;background:var(--input);position:relative;flex:none;transition:background .2s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:var(--fg);transition:transform .2s}
.tg.on{background:var(--pos)}.tg.on::after{transform:translateX(20px)}
.badge{background:var(--blue);color:#fff;border-radius:99px;font-size:11px;padding:1px 7px;margin-left:6px;font-weight:700}
.note{font-size:13px;color:var(--fg2);padding:2px 6px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:360px){.big{font-size:30px}.top h1{font-size:27px}}
</style>

function spark(vals,w,h){

  var out=['Дата;Тип;Категория;Счёт;Сумма;Заметка;Счёт зачисления'].concat(rows.map(function(t){return [t.date,T[t.type]||t.type,t.category,acName(acOf(t)),String(t.amount).replace('.',','),t.note||'',t.type==='transfer'?acName(t.toAccount||'card'):''].map(csvCell).join(';')}));

}
function parseCSV(text){
  text=text.replace(/^﻿/,'');var first=text.split(/\r?\n/)[0]||'';var dl=first.split(';').length>=first.split(',').length?';':',';
  var rows=[],row=[],cell='',q=false;
  for(var i=0;i<text.length;i++){var ch=text[i];
    if(q){if(ch==='"'){if(text[i+1]==='"'){cell+='"';i++}else q=false}else cell+=ch}
    else if(ch==='"')q=true;else if(ch===dl){row.push(cell);cell=''}
    else if(ch==='\n'||ch==='\r'){if(ch==='\r'&&text[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(function(x){return x!==''}))rows.push(row);row=[]}
    else cell+=ch}
  if(cell!==''||row.length){row.push(cell);if(row.some(function(x){return x!==''}))rows.push(row)}
  return rows;
}
function normDate(s){s=(s||'').trim();var m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return m[1]+'-'+m[2]+'-'+m[3];m=s.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);if(m)return m[3]+'-'+two(+m[2])+'-'+two(+m[1]);return ''}
async function importCSV(file){

  msg.className='note';msg.textContent='Читаю файл…';

  var rows=parseCSV(text);if(rows.length<2){msg.className='err';msg.textContent='В файле нет данных.';return}
  var head=rows[0].map(function(x){return x.trim().toLowerCase()}),ix=function(n){return head.indexOf(n)};
  var ci={d:ix('дата'),t:ix('тип'),c:ix('категория'),a:ix('счёт'),s:ix('сумма'),n:ix('заметка'),to:ix('счёт зачисления')};
  if(ci.d<0||ci.t<0||ci.s<0){msg.className='err';msg.textContent='Нужны колонки «Дата», «Тип» и «Сумма».';return}
  var T={'доход':'income','расход':'expense','перевод':'transfer','income':'income','expense':'expense','transfer':'transfer'};
  var keys={};S.raw.tx.forEach(function(t){keys[[t.date,t.type,t.category,acOf(t),Number(t.amount),(t.note||'').trim()].join('|')]=1});
  var byName={};accts().forEach(function(a){byName[a.name.toLowerCase()]=a.id});
  var ok=0,dup=0,bad=0,fresh=[];
  rows.slice(1).forEach(function(r){
    var type=T[(r[ci.t]||'').trim().toLowerCase()],date=normDate(r[ci.d]),amt=parseAmt(r[ci.s]);
    var an=ci.a>=0?(r[ci.a]||'').trim().toLowerCase():'',aid=an?byName[an]:'card';
    var toN=ci.to>=0?(r[ci.to]||'').trim().toLowerCase():'',tid=toN?byName[toN]:'';
    if(!type||!date||!(amt>0)||!aid||(type==='transfer'&&(!tid||tid===aid))){bad++;return}
    var cat=type==='transfer'?'Перевод':((ci.c>=0?(r[ci.c]||'').trim():'')||'Другое'),note=ci.n>=0?(r[ci.n]||'').trim():'';
    var k=[date,type,cat,aid,amt,note].join('|');if(keys[k]){dup++;return}keys[k]=1;
    var d={type:type,amount:amt,category:cat,account:aid,note:note,date:date,ts:Date.now(),by:'import'};if(type==='transfer')d.toAccount=tid;fresh.push(d)});
  try{for(var i=0;i<fresh.length;i++){msg.textContent='Загружаю '+(i+1)+' из '+fresh.length+'…';await col.tx.add(fresh[i]);ok++}
    msg.className=bad?'note':'ok';msg.textContent='Добавлено: '+ok+'. Пропущено повторов: '+dup+'. Строк с ошибками: '+bad+'.'}
  catch(e){msg.className='err';msg.textContent='Загрузка остановилась на '+(ok+1)+'-й строке. Уже добавлено: '+ok+'. Повторная загрузка файла не создаст дублей.'}
}

function sub(name,key){
  col[key]=null;
}
render();
/* Локальная база: данные хранятся на этом устройстве и сохраняются автоматически. */
var LOCAL_DB_KEY='finance-local-v1';
var localDB={};
function readLocalDB(){try{localDB=JSON.parse(localStorage.getItem(LOCAL_DB_KEY)||'{}')||{}}catch(e){localDB={}}}
function writeLocalDB(){try{localStorage.setItem(LOCAL_DB_KEY,JSON.stringify(localDB))}catch(e){alert('Не удалось сохранить данные: возможно, закончилось место в памяти браузера. Сделайте экспорт резервной копии.')}}
function notifyLocal(name){var c=localDB[name]||[];var snap={docs:c.map(function(x){return{ id:x.id, data:function(){var z=Object.assign({},x);delete z.id;return z}}})};(localListeners[name]||[]).forEach(function(fn){fn(snap)})}
var localListeners={};
function localCollection(name){if(!localDB[name])localDB[name]=[];if(!localListeners[name])localListeners[name]=[];return{
 onSnapshot:function(fn){localListeners[name].push(fn);fn({docs:localDB[name].map(function(x){return{id:x.id,data:function(){var z=Object.assign({},x);delete z.id;return z}}})})},
 add:async function(data){var id='r'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);localDB[name].push(Object.assign({},data,{id:id}));writeLocalDB();notifyLocal(name);return{id:id}},
 doc:function(id){return{set:async function(data){var a=localDB[name],i=a.findIndex(function(x){return x.id===id}),v=Object.assign({},data,{id:id});if(i<0)a.push(v);else a[i]=v;writeLocalDB();notifyLocal(name)},update:async function(data){var a=localDB[name],i=a.findIndex(function(x){return x.id===id});if(i<0)throw Error('Запись не найдена');a[i]=Object.assign({},a[i],data);writeLocalDB();notifyLocal(name)},delete:async function(){localDB[name]=localDB[name].filter(function(x){return x.id!==id});writeLocalDB();notifyLocal(name)}}}
}}
readLocalDB();
var db={collection:localCollection};
var names={tx:'tx',acc:'acc',cat:'cat',bud:'bud',debt:'debt'};
Object.keys(names).forEach(function(k){col[k]=db.collection(names[k]);col[k].onSnapshot(function(s){S.off=false;S.loaded[k]=true;S.raw[k]=s.docs.map(function(d){return Object.assign({},d.data()||{},{id:d.id})});if(!sh.open)render();else renderBg()})});
S.off=false;render();
/* Резервная копия JSON */
function financeBackup(){var blob=new Blob([JSON.stringify({app:'finance',version:1,data:localDB},null,2)],{type:'application/json'});var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='finance-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(a.href)},1000)}
function financeRestore(file){var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result),keys=['tx','acc','cat','bud','debt'],d=o.data||o['Финансы']||o;if(o.collections&&typeof o.collections==='object'){var c=o.collections;d={};keys.forEach(function(k){var src=c[k];if(Array.isArray(src)){d[k]=src.map(function(x,i){return Object.assign({},x,{id:x&&x.id||'import_'+k+'_'+i})});return}if(!src||typeof src!=='object'){d[k]=[];return}d[k]=Object.keys(src).map(function(id){var x=src[id];if(x&&x.data&&typeof x.data==='object')x=x.data;if(!x||typeof x!=='object'||Array.isArray(x))x={value:x};return Object.assign({},x,{id:x.id||id})})})}if(!d||typeof d!=='object')throw Error('bad');keys.forEach(function(k){if(!Array.isArray(d[k]))d[k]=[];d[k]=d[k].map(function(x,i){return Object.assign({},x,{id:x&&x.id||'import_'+k+'_'+i})})});if(o.counts){keys.forEach(function(k){var n=Number(o.counts[k]||0);if(n!==d[k].length)throw Error('count_'+k)})}var total=keys.reduce(function(n,k){return n+d[k].length},0);if(!total)throw Error('empty');if(!confirm('Восстановить '+d.tx.length+' операций, '+d.bud.length+' бюджетов и '+d.debt.length+' долгов? Текущие данные на этом устройстве будут заменены.'))return;localDB=d;writeLocalDB();Object.keys(names).forEach(notifyLocal);alert('Данные восстановлены.')}catch(e){alert(e&&String(e.message||e).indexOf('count_')===0?'Количество записей не совпало с экспортом. Данные не изменены.':'Не удалось прочитать JSON-файл или он пустой. Данные не изменены.')}};r.readAsText(file)}
/* Верхняя дублирующая панель резервного копирования убрана.
   Импорт/экспорт остаётся внутри раздела «Ещё → Импорт и экспорт». */
