<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style><title>Планы и продажи</title>
<meta name="theme-color" content="#10141c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
/* Layout: заголовок, прокручиваемый экран, нижняя панель из 5 разделов. Стиль как у «Финансов»: графит, стекло, крупные числа */
:root{
  --bg:#0c0c0e;--glow:#25252b;--card:rgba(255,255,255,.065);--card2:rgba(255,255,255,.11);--line:rgba(255,255,255,.085);
  --fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#6e6e73;--pos:#34c759;--neg:#ff6961;--warn:#ffb340;--blue:#0a84ff;
  --cap:#f5b82e;--sof:#2f7bf5;--kli:#8e5cf0;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background-color:var(--bg);background-image:radial-gradient(120% 50% at 50% -8%,var(--glow) 0%,transparent 62%);background-repeat:no-repeat;
  color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.35;-webkit-font-smoothing:antialiased;
  padding-block:14px 110px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));min-height:100vh}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.glass{background:var(--card);border:1px solid var(--line);border-radius:26px;backdrop-filter:blur(28px);-webkit-backdrop-filter:blur(28px)}
.pad{padding:18px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--fg2)}
.pos{color:var(--pos)}.neg{color:var(--neg)}.mut{color:var(--fg2)}.warn{color:var(--warn)}
.row{display:flex;align-items:center;gap:12px}
.sp{flex:1;min-width:0}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:2px 2px 0}
.top h1{margin:0;font-size:32px;font-weight:700;letter-spacing:-.02em}
.top small{color:var(--fg2);font-size:13px}
.hero{padding:20px;background-image:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.03) 60%)}
.big{font-size:40px;font-weight:700;letter-spacing:-.03em;line-height:1.05;white-space:nowrap}
.big small{font-size:22px;color:var(--fg2);font-weight:600;margin-left:3px}
.h2{font-size:18px;font-weight:700;letter-spacing:-.01em;margin:0}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;position:relative}
.bar i{display:block;height:100%;border-radius:99px}
.tick{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg2);border-radius:2px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tiles>div{padding:14px 16px;min-width:0}
.tiles b{display:block;font-size:20px;margin-top:4px;letter-spacing:-.01em;overflow-wrap:anywhere}
.tiles span.s{display:block;font-size:12px;color:var(--fg2);margin-top:3px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--fg2)}
.kv b{white-space:nowrap}
.dot{width:9px;height:9px;border-radius:50%;flex:none;display:inline-block}
.list{display:flex;flex-direction:column;overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 16px;width:100%;text-align:left}
.item+.item{border-top:1px solid var(--line)}
.item .t1{font-weight:600;overflow-wrap:anywhere}
.item .t2{color:var(--fg2);font-size:13px}
.item .am{font-weight:650;white-space:nowrap}
.day{padding:12px 6px 0;display:flex;justify-content:space-between;color:var(--fg2);font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.seg{display:flex;background:rgba(255,255,255,.07);border-radius:13px;padding:3px;gap:2px}
.seg button{flex:1;padding:9px 6px;border-radius:10px;font-weight:600;color:var(--fg2);font-size:14px}
.seg button.on{background:var(--card2);color:var(--fg)}
.pill{display:inline-block;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:650;background:rgba(255,255,255,.1);white-space:nowrap}
.pill.g{background:rgba(52,199,89,.18);color:var(--pos)}.pill.r{background:rgba(255,105,97,.18);color:var(--neg)}.pill.y{background:rgba(255,179,64,.18);color:var(--warn)}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;display:grid;grid-template-columns:repeat(5,1fr);background:rgba(18,18,20,.82);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);
  border-top:1px solid var(--line);padding:8px max(8px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--fg3);padding:4px 0}
.tabs button.on{color:var(--blue)}
.empty{padding:26px 20px;text-align:center;color:var(--fg2)}
.note{font-size:13px;color:var(--fg2);padding:2px 6px}
.more{font-size:14px;color:var(--blue);font-weight:600}
svg{display:block}
@media (max-width:360px){.big{font-size:32px}.top h1{font-size:27px}}
</style>

<div class="wrap" id="view"></div>
<nav class="tabs" id="tabs"></nav>

<script>
(function(){
var IC={home:"M3 11l9-8 9 8M5 10v10h14V10M10 20v-6h4v6",box:"M3 7l9-4 9 4v10l-9 4-9-4zM3 7l9 4 9-4M12 11v10",cal:"M4 6h16v14H4zM4 10h16M8 3v4M16 3v4",coin:"M12 5c4 0 7 1 7 2.5S16 10 12 10 5 9 5 7.5 8 5 12 5zM5 7.5v4C5 13 8 14 12 14s7-1 7-2.5v-4M5 11.5v4C5 17 8 18 12 18s7-1 7-2.5v-4",pct:"M6 18L18 6M8 8h.01M16 16h.01"};
function svg(n,s){return '<svg width="'+(s||24)+'" height="'+(s||24)+'" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="'+IC[n]+'"/></svg>'}
var fmt=new Intl.NumberFormat('ru-RU',{minimumFractionDigits:0,maximumFractionDigits:2});
function money(n){return fmt.format(Math.round(n*100)/100)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function dm(d){var p=d.split('-');return p[2]+'.'+p[1]}
function two(n){return n<10?'0'+n:''+n}
function todayStr(){var d=new Date();return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
var DOW=['вс','пн','вт','ср','чт','пт','сб'];
function dw(d){return DOW[new Date(d+'T12:00:00').getDay()]}
var START='2026-11-02',END='2026-11-30';
function weekdays(from,to){var n=0,d=new Date(from+'T12:00:00'),e=new Date(to+'T12:00:00');while(d<=e){var g=d.getDay();if(g>0&&g<6)n++;d.setDate(d.getDate()+1)}return n}
function addDay(s){var d=new Date(s+'T12:00:00');d.setDate(d.getDate()+1);return d.getFullYear()+'-'+two(d.getMonth()+1)+'-'+two(d.getDate())}
function daysLeft(due){return Math.round((new Date(due+'T12:00:00')-new Date(todayStr()+'T12:00:00'))/86400000)}
function sum(a,f){var s=0;a.forEach(function(x){s+=Number(f(x))||0});return s}

var S={tab:'sum',pt:'capella',cfg:{},ok:false,off:false,open:{}};
var PCOL={capella:'var(--cap)',sofion:'var(--sof)',klinkor:'var(--kli)'};
function items(k){var d=S.cfg[k];return d&&d.items?d.items:[]}
function calc(){
  var m=S.cfg.main||{},days=items('days'),ak=items('akb'),t=todayStr();
  var sold=sum(days,function(d){return d.sold}),coll=sum(days,function(d){return d.collected}),direct=sum(days,function(d){return d.direct});
  var hand=sum(days.filter(function(d){return d.date>(m.handover||'')}),function(d){return d.collected-d.direct});
  var last=t>END?END:t,el=weekdays(START,last>START?last:START),rem=t>=END?0:weekdays(addDay(t>START?t:START),END);
  if(t<START){el=0;rem=weekdays(START,END)}
  var plan=m.planTotal||2000000,p90=m.p90||plan*.9;
  var prod={};['capella','sofion','klinkor'].forEach(function(k){
    var pl=(m.plans||{})[k]||{sum:0,akb:0,name:k,sub:''},es=ak.filter(function(a){return a.p===k});
    prod[k]={pl:pl,sold:sum(es,function(a){return a.sum}),akb:es.filter(function(a){return a.isNew}).length,es:es}});
  var c=S.cfg.comm||{},dr=sum(c.driver||[],function(x){return x.amount}),late=sum(c.late||[],function(x){return x.amount});
  var base=coll+dr-late,pct=c.pct||2;
  return{m:m,days:days,sold:sold,coll:coll,direct:direct,hand:hand,el:el,rem:rem,plan:plan,p90:p90,prod:prod,c:c,dr:dr,late:late,base:base,pct:pct,com:base*pct/100};
}
function per(a,b){return b>0?a/b:0}

function head(t,sub){return '<div class="top" style="flex-direction:row;align-items:flex-start;justify-content:space-between;gap:8px"><div><h1>'+t+'</h1>'+(sub?'<small>'+sub+'</small>':'')+'</div><button id="dataMenuBtn" aria-label="Резервная копия" style="width:40px;height:40px;border:1px solid var(--line);border-radius:14px;background:var(--card);font-size:22px">···</button></div>'}
function note(){if(S.off)return '<div class="glass pad mut" style="font-size:14px">Нет подключения к базе. Откройте страницу через приложение Claude и войдите в аккаунт.</div>';if(!S.ok)return '<div class="glass pad mut" style="font-size:14px">Загружаю данные…</div>';return ''}
function barHtml(v,max,col,ticks){var p=max>0?Math.min(100,Math.max(v>0?2:0,v/max*100)):0;return '<div class="bar"><i style="width:'+p+'%;background:'+col+'"></i>'+(ticks||'')+'</div>'}

function dayChart(days){
  var mx=1;days.forEach(function(d){mx=Math.max(mx,d.sold)});
  var h='<div style="display:flex;align-items:flex-end;justify-content:space-between;gap:6px;height:100px">';
  days.forEach(function(d){h+='<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;min-width:0"><div style="width:100%;max-width:26px;height:74px;display:flex;align-items:flex-end"><i style="display:block;width:100%;border-radius:6px 6px 3px 3px;background:'+(d.sold>0?'var(--blue)':'rgba(255,255,255,.12)')+';height:'+Math.max(4,d.sold/mx*74)+'px"></i></div><span style="font-size:11px;color:var(--fg2)" class="num">'+dm(d.date)+'</span></div>'});
  return h+'</div>';
}

function vSum(){
  var c=calc(),m=c.m,left90=Math.max(0,c.p90-c.sold),left100=Math.max(0,c.plan-c.sold);
  var h=head('Продажи','ноябрь 2026')+note();
  var tk='<span class="tick" style="left:'+(c.p90/c.plan*100)+'%"></span>';
  h+='<div class="glass hero"><div class="lbl">Продано за месяц</div><div class="big num" style="margin:6px 0 14px">'+money(c.sold)+'<small>₽</small></div>'+barHtml(c.sold,c.plan,'var(--blue)',tk)+
   '<div class="row" style="justify-content:space-between;margin-top:8px;font-size:12px;color:var(--fg2)"><span class="num">'+Math.round(c.sold/c.plan*100)+'% от плана</span><span class="num">90% = '+money(c.p90)+' · 100% = '+money(c.plan)+'</span></div></div>';
  h+='<div class="tiles"><div class="glass"><div class="lbl">До 90%</div><b class="num">'+money(Math.round(left90))+' ₽</b><span class="s num">нужно '+money(Math.round(per(left90,c.rem)))+' ₽ в день</span></div><div class="glass"><div class="lbl">До 100%</div><b class="num">'+money(Math.round(left100))+' ₽</b><span class="s num">нужно '+money(Math.round(per(left100,c.rem)))+' ₽ в день</span></div></div>';
  h+='<div class="glass pad row" style="justify-content:space-between"><div><div class="lbl">Сейчас в среднем</div><div style="font-size:24px;font-weight:700" class="num">'+money(Math.round(per(c.sold,c.el)))+' ₽ <span style="font-size:14px;color:var(--fg2);font-weight:600">в день</span></div></div><div style="text-align:right" class="mut"><div class="num">'+c.el+' раб. дн. прошло</div><div class="num">'+c.rem+' осталось</div></div></div>';
  h+='<div class="glass pad"><div class="row" style="justify-content:space-between;margin-bottom:12px"><h3 class="h2">Продажи по дням</h3><button class="more" data-t="days">Все ›</button></div>'+dayChart(c.days)+'</div>';
  h+='<div class="glass pad"><h3 class="h2" style="margin-bottom:6px">Деньги</h3><div class="kv"><span>Собрано с 1 ноября</span><b class="num">'+money(c.coll)+' ₽</b></div><div class="kv"><span>Переведено напрямую в офис</span><b class="num">'+money(c.direct)+' ₽</b></div><div class="kv"><span>На руках, до сдачи в офис</span><b class="num pos">'+money(c.hand)+' ₽</b></div><div class="kv"><span>Долги магазинов</span><b class="num '+(m.debtTotal?'warn':'')+'">'+money(m.debtTotal||0)+' ₽</b></div><div class="note" style="padding:6px 0 0">'+esc(m.debtAsOf||'')+'</div></div>';
  h+='<div class="glass pad"><div class="row" style="justify-content:space-between;margin-bottom:6px"><h3 class="h2">Спецзадачи</h3><button class="more" data-t="prod">Подробнее ›</button></div>';
  ['capella','sofion','klinkor'].forEach(function(k){var p=c.prod[k];h+='<div style="padding:9px 0"><div class="row" style="justify-content:space-between;gap:8px"><span class="row" style="gap:9px"><i class="dot" style="background:'+PCOL[k]+'"></i><b>'+esc(p.pl.name)+'</b></span><span class="num mut" style="font-size:14px">'+money(p.sold)+' / '+money(p.pl.sum)+' ₽ · '+p.akb+' / '+p.pl.akb+' АКБ</span></div><div style="margin-top:8px">'+barHtml(p.sold,p.pl.sum,PCOL[k])+'</div></div>'});
  return h+'</div>'+'<div class="note">Обновлено: '+esc(m.updated||'')+'</div>';
}
function vProd(){
  var c=calc(),h=head('Спецзадачи','Капелла · Софион · Клинкор')+note();
  h+='<div class="seg">'+['capella','sofion','klinkor'].map(function(k){return '<button data-p="'+k+'" class="'+(S.pt===k?'on':'')+'">'+esc(c.prod[k].pl.name)+'</button>'}).join('')+'</div>';
  var k=S.pt,p=c.prod[k],ls=Math.max(0,p.pl.sum-p.sold),la=Math.max(0,p.pl.akb-p.akb);
  h+='<div class="glass hero"><div class="lbl">'+esc(p.pl.name)+' · '+esc(p.pl.sub)+'</div><div class="big num" style="margin:6px 0 14px">'+money(p.sold)+'<small>₽ из '+money(p.pl.sum)+'</small></div>'+barHtml(p.sold,p.pl.sum,PCOL[k])+'<div class="row" style="justify-content:space-between;margin-top:8px;font-size:13px;color:var(--fg2)"><span class="num">'+Math.round(per(p.sold,p.pl.sum)*100)+'%</span><span class="num">осталось '+money(ls)+' ₽</span></div></div>';
  h+='<div class="glass pad"><div class="row" style="justify-content:space-between;margin-bottom:10px"><div><div class="lbl">АКБ, новые магазины</div><div style="font-size:26px;font-weight:700" class="num">'+p.akb+' <span style="font-size:15px;color:var(--fg2)">из '+p.pl.akb+'</span></div></div><span class="pill '+(la===0?'g':'')+'">осталось '+la+'</span></div>'+barHtml(p.akb,p.pl.akb,PCOL[k])+'</div>';
  h+='<div class="tiles"><div class="glass"><div class="lbl">Нужно в день</div><b class="num">'+money(Math.round(per(ls,c.rem)))+' ₽</b></div><div class="glass"><div class="lbl">АКБ в день</div><b class="num">'+(Math.round(per(la,c.rem)*100)/100)+'</b></div></div>';
  var es=p.es.slice().sort(function(a,b){return b.date.localeCompare(a.date)}),byd={};es.forEach(function(a){(byd[a.date]=byd[a.date]||[]).push(a)});
  h+='<div class="row" style="padding:2px 4px"><h3 class="h2">Продажи по магазинам</h3></div>';
  Object.keys(byd).sort().reverse().forEach(function(d){h+='<div class="day"><span>'+dm(d)+', '+dw(d)+'</span><span class="num">'+money(sum(byd[d],function(a){return a.sum}))+' ₽</span></div><div class="glass list">'+byd[d].map(function(a){return '<div class="item"><div class="sp"><div class="t1">'+esc(a.text)+'</div><div class="t2">'+(a.isNew?'новый магазин, +1 АКБ':'тот же магазин')+'</div></div><div class="am num">'+money(a.sum)+' ₽</div></div>'}).join('')+'</div>'});
  var PR=[['Капелла',1260],['Софион Мега',1500],['Софион Макси, 2 рулона',1242],['Софион Макси, 1 рулон',1314],['Софион Меню',687],['Софион полосатый',1029],['Клинкор белый',1659],['Клинкор в клетку / разноцветный',1777.5]];
  h+='<div class="glass pad" style="margin-top:6px"><h3 class="h2" style="margin-bottom:6px">Прайс-лист, за упаковку</h3>'+PR.map(function(r){return '<div class="kv"><span>'+r[0]+'</span><b class="num">'+money(r[1])+' ₽</b></div>'}).join('')+'</div>';
  return h;
}
function vDays(){
  var c=calc(),h=head('По дням','продажи и сборы')+note();
  if(!c.days.length)return h+'<div class="glass empty">Данных пока нет.</div>';
  h+='<div class="glass pad">'+dayChart(c.days)+'</div>';
  c.days.slice().sort(function(a,b){return b.date.localeCompare(a.date)}).forEach(function(d){
    h+='<div class="glass pad"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 class="h2">'+dm(d.date)+' <span class="mut" style="font-weight:500;font-size:14px">'+dw(d.date)+'</span></h3></div><div class="kv"><span>Продано</span><b class="num">'+money(d.sold)+' ₽</b></div><div class="kv"><span>Собрано</span><b class="num pos">'+money(d.collected)+' ₽</b></div>'+(d.direct?'<div class="kv"><span>Из них напрямую в офис</span><b class="num">'+money(d.direct)+' ₽</b></div>':'')+(d.note?'<div class="note" style="padding:6px 0 0">'+esc(d.note)+'</div>':'')+'</div>'});
  return h;
}
function vPay(){
  var ps=items('pay'),h=head('Оплаты долгов','по магазинам')+note();
  if(!ps.length)return h+'<div class="glass empty">Данных пока нет.</div>';
  var byd={};ps.forEach(function(p){(byd[p.date]=byd[p.date]||[]).push(p)});
  Object.keys(byd).sort().reverse().forEach(function(d){h+='<div class="day"><span>'+dm(d)+', '+dw(d)+'</span><span class="num">'+money(sum(byd[d],function(p){return p.amount}))+' ₽</span></div><div class="glass list">'+byd[d].map(function(p){return '<div class="item"><div class="sp"><div class="t1">'+esc(p.store)+'</div>'+(p.note?'<div class="t2">'+esc(p.note)+'</div>':'')+'</div><div class="am num">'+money(p.amount)+' ₽</div></div>'}).join('')+'</div>'});
  return h+'<div class="note">Прямые переводы в офис (02.11, 03.11, 04.11) сюда не входят, магазины по ним не записаны.</div>';
}
function vCom(){
  var c=calc(),cm=c.c,h=head('Комиссия '+c.pct+'%','деньги в офис за 21 день')+note();
  h+='<div class="glass hero"><div class="lbl">Моя комиссия сейчас</div><div class="big num" style="margin:6px 0 4px">'+money(c.com)+'<small>₽</small></div><div class="mut num" style="font-size:14px">'+c.pct+'% от '+money(c.base)+' ₽</div></div>';
  h+='<div class="glass pad"><h3 class="h2" style="margin-bottom:6px">Как считается</h3><div class="kv"><span>Собрано</span><b class="num">'+money(c.coll)+' ₽</b></div><div class="kv"><span>+ оплачено водителю</span><b class="num">'+money(c.dr)+' ₽</b></div><div class="kv"><span>− занесено с опозданием</span><b class="num neg">'+money(c.late)+' ₽</b></div><div class="kv"><span>База</span><b class="num">'+money(c.base)+' ₽</b></div><div class="note" style="padding:6px 0 0">21 день считается от даты накладной до дня, когда деньги дошли в офис. Оплаты за 09–10.11 пока учтены как сданные в срок.</div></div>';
  var soon=(cm.soon||[]).slice().sort(function(a,b){return a.due.localeCompare(b.due)});
  if(soon.length){
    var pot=sum(soon.filter(function(x){return daysLeft(x.due)>=0}),function(x){return x.amount})*c.pct/100;
    h+='<div class="row" style="justify-content:space-between;padding:2px 4px"><h3 class="h2">Ещё можно успеть</h3><span class="pill g num">+'+money(pot)+' ₽</span></div>';
    var byd={};soon.forEach(function(x){(byd[x.due]=byd[x.due]||[]).push(x)});
    Object.keys(byd).sort().forEach(function(d){var n=daysLeft(d),pc=n<0?'<span class="pill r">срок прошёл</span>':(n===0?'<span class="pill r">сегодня</span>':'<span class="pill '+(n<=2?'y':'')+'">'+n+' дн.</span>');
      h+='<div class="day"><span>до '+dm(d)+'</span>'+pc+'</div><div class="glass list">'+byd[d].map(function(x){return '<div class="item"><div class="sp"><div class="t1">'+esc(x.store)+'</div></div><div class="am num">'+money(x.amount)+' ₽</div></div>'}).join('')+'</div>'});
  }
  h+='<div class="row" style="padding:10px 4px 0"><h3 class="h2">Оплачено водителю</h3></div><div class="glass list">'+(cm.driver||[]).map(function(x){return '<div class="item"><div class="sp"><div class="t1">'+esc(x.store)+'</div><div class="t2">'+dm(x.date)+', '+esc(x.how)+'</div></div><div class="am num">'+money(x.amount)+' ₽</div></div>'}).join('')+'</div>';
  h+='<div class="row" style="padding:10px 4px 0"><h3 class="h2">Занесено с опозданием</h3></div><div class="glass list">'+(cm.late||[]).map(function(x){return '<div class="item"><div class="sp"><div class="t1">'+esc(x.store)+'</div>'+(x.note?'<div class="t2">'+esc(x.note)+'</div>':'')+'</div><div class="am num neg">'+money(x.amount)+' ₽</div></div>'}).join('')+'</div>';
  return h;
}
function render(){
  var y=window.scrollY,h=S.tab==='sum'?vSum():S.tab==='prod'?vProd():S.tab==='days'?vDays():S.tab==='pay'?vPay():vCom();
  document.getElementById('view').innerHTML=h;
  var T=[['sum','Сводка','home'],['prod','Задачи','box'],['days','Дни','cal'],['pay','Оплаты','coin'],['com','2%','pct']];
  document.getElementById('tabs').innerHTML=T.map(function(t){return '<button data-t="'+t[0]+'" class="'+(S.tab===t[0]?'on':'')+'">'+svg(t[2])+t[1]+'</button>'}).join('');

document.addEventListener('click',function(e){
  var b=e.target.closest('[data-t],[data-p]');if(!b)return;
  if(b.hasAttribute('data-p')){S.pt=b.getAttribute('data-p');render();return}
  S.tab=b.getAttribute('data-t');render();window.scrollTo(0,0);
});
render();
(function(){
  var STORAGE_KEY='plans_sales_cfg_v1';
  var LEGACY_KEY='plans-sales-local-v1';
  var proxyCache = new WeakMap();
  function persistConfig(){
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(S.cfg)); }
    catch(e) { console.error('Не удалось автоматически сохранить данные приложения «Планы и продажи».', e); }
  }
  function observeConfig(value){
    if(!value || typeof value!=='object') return value;
    if(proxyCache.has(value)) return proxyCache.get(value);
    var proxy=new Proxy(value, {
      get:function(target,key){
        var result=Reflect.get(target,key,target);
        return result && typeof result==='object' ? observeConfig(result) : result;
      },
      set:function(target,key,next){
        var ok=Reflect.set(target,key,next,target);
        if(ok) persistConfig();
        return ok;
      },
      deleteProperty:function(target,key){
        var ok=Reflect.deleteProperty(target,key);
        if(ok) persistConfig();
        return ok;
      }
    });
    proxyCache.set(value,proxy);
    return proxy;
  }
  function installConfig(cfg){
    S.cfg=observeConfig(cfg && typeof cfg==='object' ? cfg : {});
    S.ok=true; S.off=false;
    persistConfig();
  }
  try {
    var saved=localStorage.getItem(STORAGE_KEY);
    if(!saved) saved=localStorage.getItem(LEGACY_KEY);
    installConfig(saved ? JSON.parse(saved) : {});
  } catch(e) { installConfig({}); }
  render();
  function normalizePlansExport(obj){
    if(!obj || typeof obj!=='object' || Array.isArray(obj)) throw new Error('Файл не является объектом JSON');
    var source=obj.collections && obj.collections.cfg ? obj.collections.cfg :
      (obj.cfg ? obj.cfg : (obj['Планы и продажи'] ? obj['Планы и продажи'] : obj));
    if(!source || typeof source!=='object' || Array.isArray(source)) throw new Error('Раздел cfg не найден');
    function dataOf(key){
      var doc=source[key] || {};
      return doc && doc.data && typeof doc.data==='object' && !Array.isArray(doc.data) ? doc.data : doc;
    }
    var akb=dataOf('akb'), days=dataOf('days'), pay=dataOf('pay');
    var comm=dataOf('comm'), main=dataOf('main');
    var cfg={
      akb:{items:Array.isArray(akb.items)?akb.items:[]},
      days:{items:Array.isArray(days.items)?days.items:[]},
      pay:{items:Array.isArray(pay.items)?pay.items:[]},
      comm:{
        driver:Array.isArray(comm.driver)?comm.driver:[],
        late:Array.isArray(comm.late)?comm.late:[],
        soon:Array.isArray(comm.soon)?comm.soon:[],
        pct:Number(comm.pct)||2
      },
      main:main
    };
    if(!cfg.main || typeof cfg.main!=='object' || !cfg.main.plans) throw new Error('В JSON отсутствуют настройки планов');
    var counts={akb:cfg.akb.items.length,days:cfg.days.items.length,pay:cfg.pay.items.length,
      driver:cfg.comm.driver.length,late:cfg.comm.late.length,soon:cfg.comm.soon.length};
    var total=counts.akb+counts.days+counts.pay+counts.driver+counts.late+counts.soon;
    if(total===0) throw new Error('В JSON не найдены записи приложения');
    return {cfg:cfg,counts:counts,total:total};
  }
  window.importPlansData=function(obj){
    try{
      var parsed=normalizePlansExport(obj),cfg=parsed.cfg,c=parsed.counts;
      var msg='Найден экспорт «Планы и продажи».\\n\\n'+
        'Продажи товаров: '+c.akb+'\\nДни: '+c.days+'\\nОплаты: '+c.pay+'\\n'+
        'Оплачено водителю: '+c.driver+'\\nДолги с опозданием: '+c.late+'\\n'+
        'Ожидаемые оплаты: '+c.soon+'\\n\\nВсего записей: '+parsed.total+'\\n\\n'+
        'Заменить данные приложения на этом устройстве?';
      if(!confirm(msg)) return;
      installConfig(cfg);
      render();
      alert('Импорт завершён. Загружено записей: '+parsed.total+'.');
    }catch(e){
      console.error('Ошибка импорта «Планы и продажи»:',e);
      alert('Импорт отменён: '+(e && e.message ? e.message : 'неверный формат JSON')+'\\nТекущие данные не изменены.');
    }
  };
  window.exportPlansData=function(){
    var blob=new Blob([JSON.stringify(S.cfg,null,2)],{type:'application/json'});
    var a=document.createElement('a');var url=URL.createObjectURL(blob);a.href=url;a.download='plans-sales-backup.json';a.click();setTimeout(function(){URL.revokeObjectURL(url)},1500);
  };
  var dataInput=document.createElement('input');dataInput.type='file';dataInput.accept='.json,application/json';dataInput.hidden=true;document.body.appendChild(dataInput);
  dataInput.onchange=function(){var f=dataInput.files&&dataInput.files[0];if(!f)return;var rd=new FileReader();rd.onload=function(){try{window.importPlansData(JSON.parse(rd.result))}catch(e){alert('Не удалось прочитать JSON-файл')}};rd.readAsText(f);dataInput.value=''};
  document.addEventListener('click',function(e){var b=e.target.closest('#dataMenuBtn');if(b){var menu=document.getElementById('plansDataMenu');if(menu){menu.remove();return}menu=document.createElement('div');menu.id='plansDataMenu';menu.style='position:fixed;z-index:100;top:68px;right:16px;padding:8px;background:#242428;border:1px solid rgba(255,255,255,.14);border-radius:16px;box-shadow:0 12px 35px #0008;display:flex;flex-direction:column;gap:4px;min-width:190px';menu.innerHTML='<button id="plansImportBtn" style="padding:12px;text-align:left;border-radius:10px">Восстановить JSON</button><button id="plansExportBtn" style="padding:12px;text-align:left;border-radius:10px">Скачать копию JSON</button>';document.body.appendChild(menu);document.getElementById('plansImportBtn').onclick=function(){menu.remove();dataInput.click()};document.getElementById('plansExportBtn').onclick=function(){menu.remove();window.exportPlansData()};return}if(!e.target.closest('#plansDataMenu')){var m=document.getElementById('plansDataMenu');if(m)m.remove()}});
})();
})();
</script>
